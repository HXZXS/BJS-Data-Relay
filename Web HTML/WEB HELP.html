<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJS 数据接力 · 开发文档</title>
<style>
:root {
    --black: #0a0a0a;
    --white: #ffffff;
    --gray-900: #1a1a1a;
    --gray-700: #404040;
    --gray-600: #6b6b6b;
    --gray-400: #a3a3a3;
    --gray-200: #e4e4e4;
    --gray-100: #f6f6f6;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--white);
    color: var(--black);
    line-height: 1.6;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border: 3px solid var(--white); }
::-webkit-scrollbar-thumb:hover { background: var(--black); }

.app { display: flex; height: 100vh; }

/* ---------- 侧边栏 ---------- */
.sidebar {
    width: 264px;
    background: var(--white);
    border-right: 1px solid var(--gray-200);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 100vh;
    overflow: hidden;
}

.sidebar-header {
    padding: 24px 20px 18px;
    border-bottom: 1px solid var(--black);
    flex-shrink: 0;
}
.sidebar-header h2 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--black);
}
.sidebar-header h2 small {
    font-weight: 400;
    font-size: 12px;
    color: var(--gray-600);
    font-family: var(--mono);
    display: block;
    margin-top: 4px;
    letter-spacing: 0.02em;
}

.sidebar-nav-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px 24px;
}
.sidebar-nav-wrap::-webkit-scrollbar { width: 8px; }
.sidebar-nav-wrap::-webkit-scrollbar-thumb { background: #d0d0d0; border: 2px solid var(--white); }

.sidebar-nav .section-title {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--gray-400);
    padding: 16px 12px 6px;
    letter-spacing: 0.12em;
    font-weight: 600;
}
.sidebar-nav a {
    display: block;
    padding: 6px 12px;
    color: var(--gray-700);
    text-decoration: none;
    font-size: 13px;
    transition: background 0.12s, color 0.12s;
    border-left: 2px solid transparent;
    cursor: pointer;
}
.sidebar-nav a:hover { background: var(--gray-100); color: var(--black); }
.sidebar-nav a.active {
    background: var(--gray-100);
    color: var(--black);
    border-left-color: var(--black);
    font-weight: 600;
}

/* ---------- 主区域 ---------- */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--white);
}

.main-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 40px 56px 80px;
}
.main-scroll::-webkit-scrollbar { width: 10px; }
.main-scroll::-webkit-scrollbar-thumb { background: #d0d0d0; border: 3px solid var(--white); }

.top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--black);
    margin-bottom: 36px;
    flex-shrink: 0;
}
.top-nav .page-info {
    font-size: 12px;
    color: var(--gray-600);
    letter-spacing: 0.02em;
    font-family: var(--mono);
}
.top-nav .page-info strong { color: var(--black); font-weight: 600; }
.top-nav .nav-buttons { display: flex; gap: 8px; }
.top-nav .nav-buttons button {
    padding: 6px 16px;
    border: 1px solid var(--black);
    background: var(--white);
    color: var(--black);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
}
.top-nav .nav-buttons button:hover:not(:disabled) {
    background: var(--black);
    color: var(--white);
}
.top-nav .nav-buttons button:disabled {
    opacity: 0.28;
    cursor: not-allowed;
}

/* ---------- 详情卡片 ---------- */
.api-detail {
    animation: fadeIn 0.18s ease;
    max-width: 900px;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.api-detail .api-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--gray-200);
}
.api-detail .method {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    color: var(--white);
    background: var(--black);
    border: 1px solid var(--black);
    text-transform: uppercase;
}
.api-detail .method.get {
    background: var(--white);
    color: var(--black);
}
.api-detail .endpoint {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--gray-700);
    padding: 4px 0;
    word-break: break-all;
}
.api-detail .api-name {
    font-size: 22px;
    font-weight: 600;
    color: var(--black);
    letter-spacing: -0.01em;
    margin-left: auto;
}

.api-detail .api-desc {
    font-size: 14px;
    color: var(--gray-700);
    line-height: 1.75;
    margin-bottom: 24px;
}
.api-detail .api-desc strong { color: var(--black); font-weight: 600; }
.api-detail .api-desc code {
    background: var(--gray-100);
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--black);
}
.api-detail .api-desc a {
    color: var(--black);
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* ---------- 参数表 ---------- */
.params-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 0 0 24px;
}
.params-table th {
    text-align: left;
    padding: 8px 12px;
    background: var(--white);
    border-bottom: 1px solid var(--black);
    color: var(--black);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}
.params-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gray-200);
    color: var(--gray-700);
    vertical-align: top;
}
.params-table code {
    background: var(--gray-100);
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--black);
}
.params-table .required {
    color: var(--black);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.04em;
}
.params-table .optional {
    color: var(--gray-400);
    font-size: 11px;
    letter-spacing: 0.04em;
}

/* ---------- 代码块 ---------- */
.code-block {
    background: var(--black);
    color: #e8e8e8;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.65;
    overflow-x: auto;
    margin: 10px 0 20px;
    white-space: pre-wrap;
    word-break: break-all;
    border-left: 3px solid var(--black);
}
.code-block .label {
    color: var(--gray-400);
    font-size: 11px;
    display: block;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ---------- 测试区 ---------- */
.test-section {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--gray-200);
}
.test-section .test-title {
    font-weight: 600;
    color: var(--black);
    margin-bottom: 14px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
}
.test-section .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
}
.test-section .row label {
    min-width: 100px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--gray-600);
}
.test-section .row input,
.test-section .row textarea,
.test-section .row select {
    flex: 1;
    min-width: 180px;
    padding: 8px 12px;
    border: 1px solid var(--gray-200);
    background: var(--white);
    font-size: 13px;
    font-family: inherit;
    color: var(--black);
    border-radius: 0;
    outline: none;
    transition: border-color 0.15s;
}
.test-section .row input:focus,
.test-section .row textarea:focus,
.test-section .row select:focus { border-color: var(--black); }
.test-section .row textarea {
    min-height: 40px;
    font-family: var(--mono);
    resize: vertical;
}
.test-section .row input[type="checkbox"] {
    flex: 0 0 auto;
    min-width: auto;
    width: 14px;
    height: 14px;
    accent-color: var(--black);
    padding: 0;
}

.test-section .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}
.btn {
    padding: 8px 20px;
    border: 1px solid var(--black);
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    background: var(--white);
    color: var(--black);
    border-radius: 0;
    transition: background 0.12s, color 0.12s;
}
.btn:hover { background: var(--black); color: var(--white); }
.btn-success { background: var(--black); color: var(--white); }
.btn-success:hover { background: #3d3d3d; border-color: #3d3d3d; }
.btn-outline { background: var(--white); color: var(--gray-700); border-color: var(--gray-200); }
.btn-outline:hover { background: var(--black); color: var(--white); border-color: var(--black); }

.result-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--gray-100);
    border-left: 3px solid var(--black);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow-y: auto;
    color: var(--gray-900);
}

/* ---------- 快速开始页面 ---------- */
.quickstart h1,
.quickstart h2 {
    font-weight: 600;
    color: var(--black);
    letter-spacing: -0.01em;
}
.quickstart h1 {
    font-size: 26px;
    margin-bottom: 8px;
}
.quickstart h2 {
    font-size: 16px;
    margin: 32px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gray-200);
}
.quickstart h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--black);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 24px 0 10px;
    color: var(--gray-600);
}
.quickstart p {
    color: var(--gray-700);
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 10px;
}
.quickstart ul {
    list-style: none;
    margin: 10px 0 16px;
}
.quickstart ul li {
    padding: 4px 0 4px 18px;
    position: relative;
    color: var(--gray-700);
    font-size: 14px;
}
.quickstart ul li::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--gray-400);
}
.quickstart strong { color: var(--black); font-weight: 600; }
.quickstart code {
    background: var(--gray-100);
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--black);
}
.quickstart a {
    color: var(--black);
    text-decoration: underline;
    text-underline-offset: 3px;
}
.quickstart .notice {
    border-left: 3px solid var(--black);
    padding: 12px 16px;
    background: var(--gray-100);
    margin: 16px 0;
    font-size: 13px;
    color: var(--gray-700);
}
.quickstart .notice strong { color: var(--black); }
.quickstart table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 14px 0 20px;
}
.quickstart table th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--black);
    font-weight: 600;
    color: var(--black);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}
.quickstart table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--gray-200);
    color: var(--gray-700);
    vertical-align: top;
}

.footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--gray-200);
    font-size: 12px;
    color: var(--gray-400);
    letter-spacing: 0.04em;
    font-family: var(--mono);
}

/* ---------- 响应式 ---------- */
@media (max-width: 820px) {
    .app { flex-direction: column; height: auto; }
    .sidebar {
        width: 100%;
        height: auto;
        max-height: 260px;
        border-right: none;
        border-bottom: 1px solid var(--gray-200);
    }
    .sidebar-nav-wrap { overflow-y: auto; max-height: 160px; }
    .main { height: auto; }
    .main-scroll { padding: 20px 20px 48px; }
    .top-nav { flex-wrap: wrap; gap: 10px; }
    .api-detail .api-name {
        font-size: 18px;
        margin-left: 0;
        width: 100%;
    }
    .quickstart h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>BJS 开发文档 <small>v6.0.4</small></h2>
    </div>
    <div class="sidebar-nav-wrap">
        <nav class="sidebar-nav" id="sidebarNav">
            <div class="section-title">概览</div>
            <a data-id="intro" class="active">简介</a>
            <a data-id="quickstart">快速开始</a>

            <div class="section-title">基础功能</div>
            <a data-id="health">健康检查</a>
            <a data-id="open">打开路径</a>
            <a data-id="msg">弹窗消息</a>
            <a data-id="run">运行程序</a>
            <a data-id="dialog">自定义对话框</a>
            <a data-id="lanzou">蓝奏云下载</a>
            <a data-id="log">查看日志</a>
            <a data-id="sysinfo">系统信息</a>

            <div class="section-title">文件操作</div>
            <a data-id="listdir">列出目录</a>
            <a data-id="readfile">读取文件</a>
            <a data-id="writefile">写入文件</a>
            <a data-id="mkdir">创建文件夹</a>
            <a data-id="delete">删除</a>
            <a data-id="copy">复制</a>
            <a data-id="move">移动</a>
            <a data-id="rename">重命名</a>
            <a data-id="fileinfo">文件属性</a>
            <a data-id="dirsize">目录大小</a>
            <a data-id="replace">文本替换</a>

            <div class="section-title">Windows 专属</div>
            <a data-id="win-attr">文件属性设置</a>
            <a data-id="win-recycle">移至回收站</a>
            <a data-id="win-reveal">资源管理器定位</a>
            <a data-id="win-notify">系统通知</a>

            <div class="section-title">高级功能（需卡密）</div>
            <a data-id="batch-rename">批量重命名</a>
            <a data-id="sync">目录同步</a>
            <a data-id="schedule">定时任务</a>
            <a data-id="clipboard">剪贴板历史</a>
            <a data-id="watch">文件监听</a>
            <a data-id="search">全文搜索</a>
            <a data-id="versions">版本管理</a>
            <a data-id="duplicates">重复文件</a>
            <a data-id="archive">压缩包管理</a>
            <a data-id="share">局域网分享</a>
            <a data-id="share-list">共享会话管理</a>
            <a data-id="remote">远程协助</a>
            <a data-id="device">多设备同步</a>
            <a data-id="plugin">插件管理</a>
            <a data-id="script">自定义脚本</a>
        </nav>
    </div>
</aside>

<main class="main">
    <div class="main-scroll" id="mainScroll">
        <div class="top-nav">
            <div class="page-info">
                <strong id="currentNavLabel">简介</strong>
                <span id="currentNavIndex">1 / 42</span>
            </div>
            <div class="nav-buttons">
                <button id="prevBtn" onclick="navigate(-1)">← 上一项</button>
                <button id="nextBtn" onclick="navigate(1)">下一项 →</button>
            </div>
        </div>
        <div id="contentContainer"></div>
        <div class="footer">BJS 数据接力 · HXZXS</div>
    </div>
</main>
</div>

<script>
const API_BASE = 'http://127.0.0.1:8765';

const apiData = [
    {
        id: 'intro',
        name: '简介',
        method: '',
        path: '',
        desc: 'BJS 数据接力是一个本地 HTTP 服务，通过 API 让网页或脚本调用系统功能。<br><br>' +
              '基础功能（打开路径、弹窗、文件读写等）无需授权，开箱即用。Windows 专属功能（属性设置、回收站、资源管理器定位、系统通知）同样属于免费范围。<br><br>' +
              '高级功能（定时任务、文件监听、版本历史、局域网分享等）需要有效卡密激活。<br><br>' +
              '服务默认监听 <code>127.0.0.1:8765</code>，所有接口返回统一的 JSON 结构：<br>' +
              '<code>{"code":0, "msg":"ok", "data": {...}}</code>，其中 <code>code === 0</code> 表示成功。',
        params: [],
        example: '',
        response: '',
        hideTest: true
    },

    // ===== 快速开始 =====
    {
        id: 'quickstart',
        name: '快速开始',
        method: '',
        path: '',
        desc: '',
        params: [],
        example: '',
        response: '',
        hideTest: true,
        customRender: 'quickstart'
    },

    // ===== 基础 =====
    {
        id: 'health',
        name: '健康检查',
        method: 'GET',
        path: '/health',
        desc: '检测服务是否正常运行。返回服务的运行状态、监听端口以及当前版本号。<br><br>' +
              '常用作前端探活，或启动脚本中的预检。',
        params: [],
        example: 'GET /health',
        response: '{"code":0,"status":"running","port":8765,"version":"6.0.4"}'
    },
    {
        id: 'open',
        name: '打开路径',
        method: 'GET',
        path: '/api/open',
        desc: '用系统默认程序打开文件或文件夹。<br><br>' +
              '文件夹使用资源管理器打开，文件使用关联程序打开。',
        params: [{ name: 'path', type: 'text', required: true, desc: '本地绝对路径' }],
        example: 'GET /api/open?path=C:\\Users',
        response: '{"code":0,"msg":"ok","data":{"path":"C:\\Users"}}'
    },
    {
        id: 'msg',
        name: '弹窗消息',
        method: 'POST',
        path: '/api/msg',
        desc: '在电脑上弹出系统消息框。支持 7 种类型，最常用的是 <code>info</code>、<code>yesno</code> 和 <code>error</code>。<br><br>' +
              '传入 <code>image</code> 参数将显示图片弹窗，适合做通知或提醒。',
        params: [
            { name: 'text', type: 'text', required: true, desc: '消息内容' },
            { name: 'title', type: 'text', required: false, desc: '窗口标题' },
            { name: 'type', type: 'select', required: false, desc: '类型', options: ['info','warning','error','question','yesno','okcancel','yesnocancel'] },
            { name: 'image', type: 'text', required: false, desc: '图片地址' },
            { name: 'width', type: 'number', required: false, desc: '图片弹窗宽度' },
            { name: 'height', type: 'number', required: false, desc: '图片弹窗高度' }
        ],
        example: 'POST /api/msg {"text":"Hello","type":"yesno"}',
        response: '{"code":0,"data":true}'
    },
    {
        id: 'run',
        name: '运行程序',
        method: 'POST',
        path: '/api/run',
        desc: '启动本地程序，可带参数，可等待程序结束后返回。<br><br>' +
              '<code>wait=true</code> 时返回程序的退出码、标准输出和错误输出。',
        params: [
            { name: 'path', type: 'text', required: true, desc: '程序路径' },
            { name: 'args', type: 'text', required: false, desc: '命令行参数' },
            { name: 'wait', type: 'checkbox', required: false, desc: '是否等待程序结束' }
        ],
        example: 'POST /api/run {"path":"notepad.exe","args":"test.txt"}',
        response: '{"code":0,"msg":"已启动"}'
    },
    {
        id: 'dialog',
        name: '自定义对话框',
        method: 'POST',
        path: '/api/dialog',

        desc: '生成临时远程协助令牌。以用户主目录为根，只读访问，限时有效。<br><br>' +
              '返回的 URL 可发送给对方，让对方在浏览器中查看你的主目录内容。',
        params: [{ name: 'expires_in', type: 'number', required: false, desc: '有效期（秒）' }],
        example: 'POST /api/advanced/remote/token {"expires_in":300}',
        response: '{"code":0,"data":{"token":"abc123","url":"http://192.168.1.10:8765/share/abc123/"}}'
    },
    {
        id: 'device',
        name: '多设备同步',
        method: 'POST',
        path: '/api/advanced/sync/device',
        desc: '登记设备与同步目录。当前为占位实现，配置会持久化到本地，供后续扩展。',
        params: [
            { name: 'device_id', type: 'text', required: true, desc: '设备标识' },
            { name: 'sync_path', type: 'text', required: true, desc: '同步目录' },
            { name: 'auto_sync', type: 'checkbox', required: false, desc: '自动同步' }
        ],
        example: 'POST /api/advanced/sync/device {"device_id":"laptop-001","sync_path":"D:\\bjs_data"}',
        response: '{"code":0,"msg":"设备 \'laptop-001\' 已配置"}'
    },
    {
        id: 'plugin',
        name: '插件管理',
        method: 'POST',
        path: '/api/advanced/plugin/install / exec',
        desc: '从 URL 或本地路径安装 Python 插件到 <code>%APPDATA%\\BJS\\data\\plugins</code>。<br><br>' +
              '执行时调用插件模块中的指定函数。',
        params: [
            { name: 'source', type: 'text', required: false, desc: '插件源' },
            { name: 'name', type: 'text', required: false, desc: '插件名' },
            { name: 'plugin', type: 'text', required: false, desc: '执行时的插件名' },
            { name: 'action', type: 'text', required: false, desc: '执行时的方法名' }
        ],
        example: 'POST /api/advanced/plugin/install {"source":"https://.../p.py","name":"backup"}',
        response: '{"code":0,"msg":"插件 \'backup\' 已安装"}'
    },
    {
        id: 'script',
        name: '自定义脚本',
        method: 'POST',
        path: '/api/advanced/script/exec',
        desc: '执行自定义 Python 脚本（当前为占位接口，等待后续实现安全沙箱）。<br><br>' +
              '注意：直接执行任意代码存在安全风险，正式版会加入权限校验。',
        params: [
            { name: 'script', type: 'textarea', required: true, desc: 'Python 脚本' },
            { name: 'timeout', type: 'number', required: false, desc: '超时（秒）' }
        ],
        example: 'POST /api/advanced/script/exec {"script":"print(1+1)","timeout":10}',
        response: '{"code":-1,"msg":"脚本执行功能未实现"}'
    }
];

let currentIndex = 0;
const total = apiData.length;

// ---------- 快速开始页面渲染 ----------
function renderQuickstart() {
    return `
        <div class="api-detail quickstart">
            <h1>快速开始</h1>
            <p>通过以下步骤在 Windows 上完成 BJS 数据接力的部署。两条安装命令最终执行的都是同一个 <code>PS-Setup.ps1</code>。</p>

            <h2>一键部署</h2>
            <p>按 <strong>Windows + R</strong> 打开「运行」对话框，粘贴以下命令并回车：</p>
            <div class="code-block"><span class="label">PowerShell</span>powershell -Exec Bypass -C "$f=$env:TEMP+'\\b.ps1';iwr 'https://bjs.r.shortio.cn/setup' -Out $f;&$f"</div>

            <h2>使用代理一键部署</h2>
            <p>适用于无法直接访问 GitHub 的用户。按 <strong>Windows + R</strong> 打开「运行」对话框：</p>
            <div class="code-block"><span class="label">Windows + R</span>powershell -Exec Bypass -C "$p=$env:TMP+'\\s.ps1';iwr 'https://bjs.r.shortio.cn/proxy' -Out $p -UseBasicParsing;if((Get-FileHash $p -A SHA256).Hash -eq '599EFF87887BAB5A72999D06E2161F31FF0C67522093270E16A9D3FF6A9E2266'){&$p}else{echo X;Read-Host}"</div>

            <p>或以<strong>管理员身份打开 PowerShell</strong>，粘贴执行：</p>
            <div class="code-block"><span class="label">PowerShell (Admin)</span>Set-ExecutionPolicy Bypass -Scope Process -Force; $f="$env:TEMP\\PS-Setup.ps1"; iwr 'https://bjs.r.shortio.cn/proxy' -Out $f -UseBasicParsing; if ((Get-FileHash $f -Algorithm SHA256).Hash -eq '599EFF87887BAB5A72999D06E2161F31FF0C67522093270E16A9D3FF6A9E2266') { & $f } else { Write-Host 'HASH MISMATCH' -ForegroundColor Red; Pause }</div>

            <div class="notice">
                <strong>注意：</strong>如果 PowerShell 输出 <code>X</code> 或 <code>HASH MISMATCH</code>，说明哈希校验失败，脚本可能已被篡改，请勿强制运行。
            </div>

            <h2>版本说明</h2>
            <table>
                <thead>
                    <tr>
                        <th>版本</th>
                        <th>运行方式</th>
                        <th>哈希校验</th>
                        <th>说明</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>GitHub 原版</td>
                        <td>Windows + R</td>
                        <td>否</td>
                        <td>源可控，安全性有保证</td>
                    </tr>
                    <tr>
                        <td>代理下载版</td>
                        <td>管理员 PowerShell</td>
                        <td>是</td>
                        <td>第三方代理 + 哈希校验</td>
                    </tr>
                </tbody>
            </table>
            <p>两条命令最终执行的都是同一个 <code>PS-Setup.ps1</code>。脚本内部的提权逻辑会在非管理员环境下自动请求 UAC，因此 GitHub 原版从 Windows + R 启动也能正常完成安装。</p>

            <h2>下载安装程序</h2>
            <p>或前往 <a href="https://github.com/HXZXS/Better-JavaScript/releases" target="_blank" rel="noopener">Releases</a> 页面下载最新的安装程序。</p>
        </div>
    `;
}

function renderDetail(index) {
    const item = apiData[index];
    if (!item) return;

    const container = document.getElementById('contentContainer');
    const label = document.getElementById('currentNavLabel');
    const idxSpan = document.getElementById('currentNavIndex');

    label.textContent = item.name;
    idxSpan.textContent = (index + 1) + ' / ' + total;
    document.getElementById('prevBtn').disabled = (index === 0);
    document.getElementById('nextBtn').disabled = (index === total - 1);

    document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
    const targetLink = document.querySelector(`.sidebar-nav a[data-id="${item.id}"]`);
    if (targetLink) targetLink.classList.add('active');

    // 快速开始页面
    if (item.customRender === 'quickstart') {
        container.innerHTML = renderQuickstart();
        return;
    }

    // 简介页
    if (item.id === 'intro') {
        container.innerHTML = `
            <div class="api-detail">
                <div class="api-head">
                    <span class="api-name" style="margin-left:0;">简介</span>
                </div>
                <div class="api-desc">${item.desc}</div>
                <div style="color:var(--gray-600); font-size:13px; margin-top:24px; padding-top:20px; border-top:1px solid var(--gray-200); line-height:1.9;">
                    <strong style="color:var(--black);">侧边栏</strong> 列出所有接口，点击即可查看对应文档。<br>
                    <strong style="color:var(--black);">上下按钮</strong> 或 <strong style="color:var(--black);">键盘方向键</strong> 可逐项翻阅。<br>
                    <strong style="color:var(--black);">在线测试</strong> 直接在本页调用接口，返回值实时显示。
                </div>
            </div>
        `;
        return;
    }

    let paramsHtml = '';
    if (item.params && item.params.length > 0) {
        paramsHtml = `
            <table class="params-table">
                <thead><tr><th>参数名</th><th>类型</th><th>说明</th><th>必填</th></tr></thead>
                <tbody>
                    ${item.params.map(p => `
                        <tr>
                            <td><code>${p.name}</code></td>
                            <td>${p.type === 'select' ? '选择' : p.type === 'checkbox' ? '布尔' :
                                   p.type === 'textarea' ? '文本' : p.type === 'number' ? '数字' : '文本'}</td>
                            <td>${p.desc}</td>
                            <td>${p.required ? '<span class="required">必填</span>' : '<span class="optional">可选</span>'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    // 测试工具
    let testHtml = '';
    if (!item.hideTest) {
        const inputRows = (item.params || []).map(p => {
            let inputHtml = '';
            if (p.type === 'select') {
                inputHtml = `<select id="test-in-${p.name}">${p.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
            } else if (p.type === 'checkbox') {
                inputHtml = `<input type="checkbox" id="test-in-${p.name}">`;
            } else if (p.type === 'textarea') {
                inputHtml = `<textarea id="test-in-${p.name}" rows="2" placeholder="输入 ${p.name}"></textarea>`;
            } else if (p.type === 'number') {
                inputHtml = `<input type="number" id="test-in-${p.name}" placeholder="数字">`;
            } else {
                inputHtml = `<input type="text" id="test-in-${p.name}" placeholder="输入 ${p.name}">`;
            }
            return `<div class="row"><label>${p.name}</label>${inputHtml}</div>`;
        }).join('');

        testHtml = `
            <div class="test-section">
                <div class="test-title">在线测试</div>
                ${inputRows}
                <div class="btn-group">
                    <button class="btn btn-success" onclick="testApi(${index})">发送请求 (${item.method.split(' ')[0]})</button>
                    <button class="btn btn-outline" onclick="clearResult(${index})">清空结果</button>
                </div>
                <div class="result-box" id="test-result-${index}">等待测试...</div>
            </div>
        `;
    }

    container.innerHTML = `
        <div class="api-detail">
            <div class="api-head">
                ${item.method ? `<span class="method ${item.method.toLowerCase().split(' ')[0] === 'get' ? 'get' : ''}">${item.method}</span>` : ''}
                ${item.path ? `<span class="endpoint">${item.path}</span>` : ''}
                <span class="api-name">${item.name}</span>
            </div>
            <div class="api-desc">${item.desc}</div>
            ${paramsHtml}
            ${item.example ? `
                <div class="code-block"><span class="label">请求示例</span>${item.example}</div>
            ` : ''}
            ${item.response ? `
                <div class="code-block" style="background:#1f1f1f;"><span class="label">响应示例</span>${item.response}</div>
            ` : ''}
            ${testHtml}
        </div>
    `;
}

function navigate(direction) {
    const newIndex = currentIndex + direction;
    if (newIndex < 0 || newIndex >= total) return;
    currentIndex = newIndex;
    renderDetail(currentIndex);
    document.getElementById('mainScroll').scrollTop = 0;
}

function navigateTo(id) {
    const idx = apiData.findIndex(item => item.id === id);
    if (idx === -1) return;
    currentIndex = idx;
    renderDetail(currentIndex);
    document.getElementById('mainScroll').scrollTop = 0;
}

window.testApi = function(idx) {
    const item = apiData[idx];
    const resBox = document.getElementById('test-result-' + idx);
    if (!resBox) return;
    resBox.textContent = '请求中...';
    try {
        const params = {};
        (item.params || []).forEach(p => {
            const el = document.getElementById('test-in-' + p.name);
            if (!el) return;
            let val;
            if (p.type === 'checkbox') val = el.checked;
            else if (p.type === 'number') val = parseFloat(el.value) || 0;
            else val = el.value || '';
            if (val !== undefined && val !== '' && val !== false) params[p.name] = val;
        });

        const method = item.method.split(' ')[0].trim();
        const path = item.path.split(' ')[0].trim();
        const url = API_BASE + path;
        const opts = { method, headers: { 'Content-Type': 'application/json' } };

        if (method === 'GET') {
            const qs = new URLSearchParams();
            for (const k in params) {
                const v = params[k];
                if (v !== undefined && v !== '' && v !== false) qs.append(k, v);
            }
            const finalUrl = qs.toString() ? url + '?' + qs.toString() : url;
            fetch(finalUrl).then(r => r.json())
                .then(data => { resBox.textContent = JSON.stringify(data, null, 2); })
                .catch(err => { resBox.textContent = '请求失败：' + err.message; });
        } else {
            opts.body = JSON.stringify(params);
            fetch(url, opts).then(r => r.json())
                .then(data => { resBox.textContent = JSON.stringify(data, null, 2); })
                .catch(err => { resBox.textContent = '请求失败：' + err.message; });
        }
    } catch (err) {
        resBox.textContent = '请求失败：' + err.message;
    }
};

window.clearResult = function(idx) {
    const box = document.getElementById('test-result-' + idx);
    if (box) box.textContent = '等待测试...';
};

document.addEventListener('keydown', function(e) {
    if (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navigate(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navigate(1); }
});

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.sidebar-nav a').forEach(link => {
        link.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            if (id) navigateTo(id);
        });
    });
    currentIndex = 0;
    renderDetail(0);
});
</script>
</body>
</html>
